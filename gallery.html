        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;

            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;

            width: 100%;
            height: auto;
            border-radius: 10px;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);

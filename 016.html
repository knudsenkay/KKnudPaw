<main>

    <section class="hero">
        <img src="images/SS-Standard.jpg" alt="Springer Spaniel">

    <section class="breed-intro">

            <article class="colour-card">

            <article class="colour-card">

            <article class="colour-card">
                <img src="images/colour/SS-Black,White.jpg" alt="Black and White Springer Spaniel" loading="lazy" decoding="async">
                <h4>Black and White</h4>
            </article>

            <article class="colour-card">
                <img src="images/colour/SS-TriColour.jpg" alt="Black, White and Tan Springer Spaniel" loading="lazy" decoding="async">

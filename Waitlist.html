<!DOCTYPE html>
<div id="header"></div>
<script>
    fetch("header.html")
        .then(res => res.text())
        .then(data => document.getElementById("header").innerHTML = data);
</script>
<body><section style="text-align:center;" class="breed-standard">
    <h1>Apply for Our Waitlist</h1>
</section>
<form id="waitlistForm" class="waitlist-form">

    <legend>Your Full Name</legend><input type="text" name="full_name" required>
    <legend>Email</legend><input type="email" name="email" required>
    <legend>Phone</legend><input type="tel" name="phone" required>
    <legend>Breed</legend><select name="breed">Cocker Spaniel</select>
    <legend>Gender</legend><select name="gender">Any</select>


<fieldset class="colour-select">
    <legend>Preferred Colour</legend>
    <label><input type="checkbox" name="colour" value="Any"> Any</label>
    <label><input type="checkbox" name="colour" value="Black & Tan"> Black & Tan</label>
    <label><input type="checkbox" name="colour" value="Black, White & Tan"> Black, White & Tan</label>
    <label><input type="checkbox" name="colour" value="Black & White"> Black & White</label>
    <label><input type="checkbox" name="colour" value="Black"> Black</label>
    <label><input type="checkbox" name="colour" value="Blue Roan & Tan"> Blue Roan & Tan</label>
    <label><input type="checkbox" name="colour" value="Blue Roan"> Blue Roan</label>
    <label><input type="checkbox" name="colour" value="Golden"> Golden</label>
    <label><input type="checkbox" name="colour" value="Lemon Roan"> Lemon Roan</label>
    <label><input type="checkbox" name="colour" value="Lemon & White"> Lemon & White</label>
    <label><input type="checkbox" name="colour" value="Liver Roan & Tan"> Liver Roan & Tan</label>
    <label><input type="checkbox" name="colour" value="Liver Roan"> Liver Roan</label>
    <label><input type="checkbox" name="colour" value="Liver & Tan"> Liver & Tan</label>
    <label><input type="checkbox" name="colour" value="Liver, White & Tan"> Liver, White & Tan</label>
    <label><input type="checkbox" name="colour" value="Liver & White"> Liver & White</label>
    <label><input type="checkbox" name="colour" value="Liver"> Liver</label>
    <label><input type="checkbox" name="colour" value="Orange Roan"> Orange Roan</label>
    <label><input type="checkbox" name="colour" value="Orange & White"> Orange & White</label>
    <label><input type="checkbox" name="colour" value="Red"> Red</label>
</fieldset>
<textarea name="home_info">Tell us about your home</textarea>
        <textarea rows="10"></textarea>
        <button type="submit">Join Waitlist</button>
    </form>
</section>
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>


</body>
<div id="footer"></div>
<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data);
</script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist</title>
    <style>
        /* Searchable location combobox */
        .combobox { position: relative; }

        .combobox-list {
            position: absolute;
            z-index: 1000;
            top: calc(100% + 2px);
            left: 0;
            right: 0;
            max-height: 260px;
            overflow-y: auto;
            margin: 0;
            padding: 4px 0;
            list-style: none;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
        }

        .combobox-list[hidden] { display: none; }

        .combobox-group {
            padding: 6px 12px;
            font-size: .78em;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #888;
            pointer-events: none;
        }

        .combobox-option {
            padding: 8px 12px;
            cursor: pointer;
        }

        .combobox-option:hover,
        .combobox-option.active {
            background: #f0f0f0;
        }

        .combobox-empty {
            padding: 8px 12px;
            color: #888;
            font-style: italic;
        }

        #locationSearch:invalid { border-color: #c0392b; }
    </style>
</head>

<body>

    <div id="head"></div>
    <div id="nav"></div>

    <main class="page-container">

        <section class="waitlist-section">
            <h1>Join the Waitlist</h1>
            <p>Fill out the form below and send the email to be added to our waitlist for upcoming litters/trained dogs.</p>

            <p>Please understand that I usually only have 1-2 dogs in training at a time. Because of this I can devote more time to them and also meet their needs.</p>

            <form id="waitlistForm" class="waitlist-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="tel" required>
                </div>

                <div class="form-group">
                    <label for="locationSearch">Location</label>
                    <div class="combobox" id="locationCombobox">
                        <input
                            id="locationSearch"
                            name="location"
                            type="text"
                            placeholder="Type to search, then select from the list"
                            autocomplete="off"
                            required
                            role="combobox"
                            aria-expanded="false"
                            aria-controls="locationListbox"
                            aria-autocomplete="list"
                            aria-haspopup="listbox"
                        >
                        <ul id="locationListbox" class="combobox-list" role="listbox" hidden></ul>
                    </div>
                </div>

                <div class="form-group">
                    <label for="dog">Preferred Dog / Litter</label>
                    <select id="dog" name="dog" required>
                        <option value="">Select an option</option>
                        <option value="Hermione">Hermione Litter</option>
                        <option value="Litter">Any Litter</option>
                        <option value="Adult">Any Adult Dog</option>
                        <option value="Trained">Any Trained</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Notes</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

            </form>

            <a href="#" id="emailLink" class="btn">
                Join the Waitlist
            </a>

        </section>

    </main>

    <div id="foot"></div>

    <script src="styles/global.js"></script>
    <script src="styles/autoload.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {

        /* ---------------------------------------------------------
           Searchable location combobox (must pick from the list)
        --------------------------------------------------------- */
        const LOCATIONS = [
            {
                group: 'Australian States & Territories',
                items: [
                    'Australian Capital Territory',
                    'New South Wales',
                    'Northern Territory',
                    'Queensland',
                    'South Australia',
                    'Tasmania',
                    'Victoria',
                    'Western Australia'
                ]
            },
            {
                group: 'United States',
                items: [
                    'Alabama', 'Alaska', 'Arizona', 'Arkansas', 'California',
                    'Colorado', 'Connecticut', 'Delaware', 'District of Columbia',
                    'Florida', 'Georgia', 'Hawaii', 'Idaho', 'Illinois', 'Indiana',
                    'Iowa', 'Kansas', 'Kentucky', 'Louisiana', 'Maine', 'Maryland',
                    'Massachusetts', 'Michigan', 'Minnesota', 'Mississippi',
                    'Missouri', 'Montana', 'Nebraska', 'Nevada', 'New Hampshire',
                    'New Jersey', 'New Mexico', 'New York', 'North Carolina',
                    'North Dakota', 'Ohio', 'Oklahoma', 'Oregon', 'Pennsylvania',
                    'Rhode Island', 'South Carolina', 'South Dakota', 'Tennessee',
                    'Texas', 'Utah', 'Vermont', 'Virginia', 'Washington',
                    'West Virginia', 'Wisconsin', 'Wyoming'
                ]
            },
            {
                group: 'Canada',
                items: [
                    'Alberta', 'British Columbia', 'Manitoba', 'New Brunswick',
                    'Newfoundland and Labrador', 'Northwest Territories',
                    'Nova Scotia', 'Nunavut', 'Ontario', 'Prince Edward Island',
                    'Quebec', 'Saskatchewan', 'Yukon'
                ]
            },
            {
                group: '',
                items: ['Other / International']
            }
        ];

        const ALL_LABELS = LOCATIONS.flatMap(g => g.items);

        const combobox = document.getElementById('locationCombobox');
        const input = document.getElementById('locationSearch');
        const listbox = document.getElementById('locationListbox');

        let activeIndex = -1;
        let visibleOptions = []; // [{ el, label }]

        function openList() {
            listbox.hidden = false;
            input.setAttribute('aria-expanded', 'true');
        }

        function closeList() {
            listbox.hidden = true;
            input.setAttribute('aria-expanded', 'false');
            input.removeAttribute('aria-activedescendant');
            activeIndex = -1;
        }

        function renderOptions(query) {
            listbox.innerHTML = '';
            visibleOptions = [];
            activeIndex = -1;

            const q = query.trim().toLowerCase();
            let matchedAny = false;

            LOCATIONS.forEach(function (group) {
                const matches = group.items.filter(function (item) {
                    return item.toLowerCase().includes(q);
                });
                if (!matches.length) return;
                matchedAny = true;

                if (group.group) {
                    const header = document.createElement('li');
                    header.className = 'combobox-group';
                    header.setAttribute('role', 'presentation');
                    header.textContent = group.group;
                    listbox.appendChild(header);
                }

                matches.forEach(function (label) {
                    const li = document.createElement('li');
                    li.id = 'loc-opt-' + visibleOptions.length;
                    li.className = 'combobox-option';
                    li.setAttribute('role', 'option');
                    li.textContent = label;
                    li.dataset.value = label;
                    listbox.appendChild(li);
                    visibleOptions.push(li);
                });
            });

            if (!matchedAny) {
                const empty = document.createElement('li');
                empty.className = 'combobox-empty';
                empty.textContent = 'No matches -- try another location';
                listbox.appendChild(empty);
            }
        }

        function setActive(index) {
            if (activeIndex >= 0 && visibleOptions[activeIndex]) {
                visibleOptions[activeIndex].classList.remove('active');
            }
            activeIndex = index;

            if (activeIndex >= 0 && visibleOptions[activeIndex]) {
                const el = visibleOptions[activeIndex];
                el.classList.add('active');
                input.setAttribute('aria-activedescendant', el.id);
                el.scrollIntoView({ block: 'nearest' });
            } else {
                input.removeAttribute('aria-activedescendant');
            }
        }

        function selectOption(li) {
            input.value = li.dataset.value;
            input.setCustomValidity('');
            closeList();
            input.focus();
        }

        // Only allow values that exist in the list
        function validateSelection() {
            const value = input.value.trim();
            if (value === '') {
                input.setCustomValidity(''); // handled by `required`
            } else if (ALL_LABELS.includes(value)) {
                input.setCustomValidity('');
            } else {
                input.setCustomValidity('Please choose a location from the list.');
            }
        }

        input.addEventListener('focus', function () {
            renderOptions(input.value);
            openList();
        });

        input.addEventListener('input', function () {
            input.setCustomValidity('');
            renderOptions(input.value);
            openList();
        });

        input.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (listbox.hidden) {
                    renderOptions(input.value);
                    openList();
                }
                if (visibleOptions.length) {
                    setActive(Math.min(activeIndex + 1, visibleOptions.length - 1));
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (visibleOptions.length) {
                    setActive(Math.max(activeIndex - 1, 0));
                }
            } else if (e.key === 'Enter') {
                if (!listbox.hidden && activeIndex >= 0 && visibleOptions[activeIndex]) {
                    e.preventDefault();
                    selectOption(visibleOptions[activeIndex]);
                }
            } else if (e.key === 'Escape' || e.key === 'Tab') {
                closeList();
            }
        });

        // mousedown + preventDefault so the input doesn't blur before selection
        listbox.addEventListener('mousedown', function (e) {
            e.preventDefault();
            const li = e.target.closest('.combobox-option');
            if (li) selectOption(li);
        });

        input.addEventListener('blur', function () {
            setTimeout(function () {
                if (!combobox.contains(document.activeElement)) {
                    validateSelection();
                    closeList();
                }
            }, 0);
        });

        document.addEventListener('click', function (e) {
            if (!combobox.contains(e.target)) {
                validateSelection();
                closeList();
            }
        });

        /* ---------------------------------------------------------
           Email submission
        --------------------------------------------------------- */
        const emailLink = document.getElementById('emailLink');
        if (!emailLink) return;

        emailLink.addEventListener('click', function (e) {
            e.preventDefault();

            validateSelection(); // make sure custom validity is up to date

            const form = document.getElementById('waitlistForm');
            if (form && !form.reportValidity()) return;

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const location = document.getElementById('locationSearch').value;
            const dog = document.getElementById('dog').value;
            const message = document.getElementById('message').value;

            const subject = encodeURIComponent('Waitlist Application');

            const body = encodeURIComponent(
`Full Name: ${name}

Email Address: ${email}

Phone Number: ${phone}

Location: ${location}

Preferred Puppy / Litter: ${dog}

Additional Notes:
${message}`
            );

            window.location.href =
                `mailto:kknudpaw.spaniels@gmail.com?subject=${subject}&body=${body}`;
        });
    });
    </script>

</body>
</html>

<!DOCTYPE html>
<div id="header"></div>

<script>
    fetch("header.html")
        .then(res => res.text())
        .then(data => document.getElementById("header").innerHTML = data);

</script>    

<section style="text-align:center;" class="breed-standard">
<img src="images/Spaniels.jpg">

<section style="text-align:center;" class="breed-standard">
<h1>GALLERY</h1>
<div class="gallery-component">
    <div class="dog-card-container" id="galleryContainer"></div>

    <!-- Popup -->
    <div id="imgPopup" class="img-popup" onclick="this.style.display='none'">
        <img id="imgPopupImg">
    </div>
</div>


<div id="footer"></div>
<script>
fetch("footer.html")
    .then(r => r.text())
    .then(d => document.getElementById("footer").innerHTML = d);
</script>
</html>

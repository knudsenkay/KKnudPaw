<script src="styles/global.js"></script>
<script src="styles/autoload.js"></script>


<div id="header"></div>
<div id="main-nav"></div>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="waitlist.js" defer></script>
</head>

<body>

    <!-- Header -->


    <main class="page-container">

        <section class="waitlist-section">
            <h1>Join the Waitlist</h1>
            <p>Fill out the form below to be added to our waitlist for upcoming litters.</p>





            <form id="waitlistForm" class="waitlist-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="tel" required>
                </div>

                <div class="form-group">
                    <label for="puppy">Preferred Puppy / Litter</label>
                    <select id="puppy" name="puppy" required>
                        <option value="">Select an option</option>
                        <option value="Hermione">Hermione Litter</option>

                        <option value="Any">Any Available</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Notes</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>







            </form>
            
            
<a href="#" id="emailLink" class="btn">
    Join the Waitlist
</a>


<script>
document.getElementById('emailLink').addEventListener('click', function(e) {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const puppy = document.getElementById('puppy').value;
    const message = document.getElementById('message').value;

    const subject = encodeURIComponent('Waitlist Application');

    const body = encodeURIComponent(
`Full Name: ${name}

Email Address: ${email}

Phone Number: ${phone}

Preferred Puppy / Litter: ${puppy}

Additional Notes:
${message}`
    );

    window.location.href =
        `mailto:kknudpaw.spaniels@gmail.com?subject=${subject}&body=${body}`;
});
</script>

        </section>

    </main>




</body>
<div id="footer"></div>
<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data);
</script>
</html>

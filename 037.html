<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Dogs | KKnudPaw Spaniels</title>

<style>
    /* ---------- Design tokens (shared site palette) ---------- */
    :root {
        --brand:        #7a4a2b;
        --brand-dark:   #4d2d18;
        --brand-light:  #f6ede4;
        --accent:       #c98a4b;
        --ink:          #2f2a26;
        --ink-soft:     #5f564e;
        --paper:        #fffdfa;
        --card-radius:  14px;
        --shadow-sm:    0 2px 6px rgba(60, 40, 20, .08);
        --shadow-md:    0 8px 22px rgba(60, 40, 20, .14);
        --max-width:    1100px;
    }

    /* ---------- Base ---------- */
    *,
    *::before,
    *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
        margin: 0;
        padding: 0 1.25rem 3rem;
        background: var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
    }

    img { max-width: 100%; height: auto; display: block; }

    /* ---------- Hero ---------- */
    .breed-hero {
        width: 100%;
        max-width: var(--max-width);
        margin-inline: auto;
        padding: 1.75rem 0 1rem;
        text-align: center;
    }

    .breed-hero img {
        margin-inline: auto;
        border-radius: var(--card-radius);
        box-shadow: var(--shadow-md);
    }

    .breed-hero h1 {
        margin: 1.75rem 0 0;
        font-size: clamp(1.9rem, 4vw, 2.75rem);
        line-height: 1.2;
        letter-spacing: -.02em;
        color: var(--brand-dark);
    }

    .breed-hero h1::after {
        content: "";
        display: block;
        width: 72px;
        height: 4px;
        margin: .75rem auto 0;
        border-radius: 4px;
        background: var(--accent);
    }

    /* ---------- Breed intro ---------- */
    .breed-standard {
        width: 100%;
        max-width: var(--max-width);
        margin-inline: auto;
        text-align: center;
    }

    .breed-standard h2 {
        margin: 2rem 0 .5rem;
        font-size: clamp(1.25rem, 2.5vw, 1.5rem);
        color: var(--brand);
    }

    .breed-standard > p {
        max-width: 62ch;
        margin: 0 auto;
        font-size: 1.0625rem;
        color: var(--ink-soft);
    }

    /* ---------- Dog card grid ---------- */
    .dog-card-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 1.5rem;
        padding: 2rem 0 1rem;
        text-align: left;
    }

    /* Hide the grid entirely while it has no cards in it */
    .dog-card-container:empty { display: none; }

    .dog-card {
        display: flex;
        flex-direction: column;
        gap: .5rem;
        padding: 1.5rem;
        background: #fff;
        border: 1px solid #efe4d8;
        border-radius: var(--card-radius);
        box-shadow: var(--shadow-sm);
        transition: transform .25s ease, box-shadow .25s ease,
                    border-color .25s ease;
    }

    .dog-card:hover {
        transform: translateY(-4px);
        border-color: var(--accent);
        box-shadow: var(--shadow-md);
    }

    .dog-card img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        border-radius: 10px;
        background: var(--brand-light);
    }

    .dog-card h3 {
        margin: 0;
        font-size: 1.125rem;
        color: var(--brand);
    }

    .dog-card p {
        margin: 0;
        color: var(--ink-soft);
    }

    /* ---------- Responsive tweaks ---------- */
    @media (max-width: 600px) {
        body { padding-inline: 1rem; }
        .dog-card-container { gap: 1.125rem; }
    }

    /* ---------- Accessibility ---------- */
    @media (prefers-reduced-motion: reduce) {
        .dog-card { transition: none; }
        .dog-card:hover { transform: none; }
    }

    :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
    }
</style>

<script src="styles/global.js" defer></script>
<script src="styles/autoload.js" defer></script>
</head>
<body>

<!-- Header / nav / footer are injected by autoload.js -->
<div id="head"></div>
<div id="nav"></div>

<main>

    <section class="breed-hero">
        <img src="images/SS.jpg" alt="Springer Spaniel">
        <h1>Our Dogs</h1>
    </section>

    <article class="breed-standard">
        <h2>Springer Spaniel</h2>
        <p>The Springer Spaniel is energetic, athletic, and highly trainable -- perfect for active families.</p>

        <div class="dog-card-container">
            <!-- Add dog cards here, e.g.:
            <div class="dog-card">
                <img src="images/dogs/name.jpg" alt="Name" loading="lazy" decoding="async">
                <h3>Name</h3>
                <p>Colour • …</p>
                <p>Notes • …</p>
            </div>
            -->
        </div>
    </article>

</main>

<div id="foot"></div>

</body>
</html>

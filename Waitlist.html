<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist | Dash & Milo</title>
    <link rel="stylesheet" href="theme.css">
    <script src="global.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="waitlist.js" defer></script>
</head>

<body>

    <!-- Header -->
    <div id="header"></div>

    <main class="page-container">

        <section class="waitlist-section">
            <h1>Join the Waitlist</h1>
            <p>Fill out the form below to be added to our waitlist for upcoming litters.</p>

            <form id="waitlistForm" class="waitlist-form">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input id="name" name="name" type="text" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input id="email" name="email" type="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input id="phone" name="phone" type="tel" required>
                </div>

                <div class="form-group">
                    <label for="puppy">Preferred Puppy / Litter</label>
                    <select id="puppy" name="puppy" required>
                        <option value="">Select an option</option>
                        <option value="Dash">Dash</option>
                        <option value="Milo">Milo</option>
                        <option value="Any">Any Available</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Additional Notes</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

                <button type="submit" class="btn-primary">Join Waitlist</button>

                <p id="waitlistSuccess" class="success-message" style="display:none;">
                    Thank you! Your waitlist request has been submitted.
                </p>

            </form>
        </section>

    </main>




</body>
<div id="footer"></div>
<script>
    fetch("footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data);
</script>

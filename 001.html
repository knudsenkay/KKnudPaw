<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KKnudPaw Spaniels -- Home</title>

    <!-- Preconnect for Poppins font (from theme.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Autoloader: fetches head/nav/foot, CSS, and global.js -->
    <script src="styles/autoload.js" defer></script>
</head>
<body>
    <!-- Autoload injects the header partial here -->
    <div id="head"></div>

    <!-- Autoload injects the nav partial here -->
    <div id="nav"></div>

    <main>
        <!-- ============================================
             HERO (full-bleed band)
             ============================================ -->
        <section class="hero">
            <h1>KKnudPaw Spaniels</h1>
            <p>Ethical, ANKC-registered Spaniels raised with care in Perth, WA.</p>
        </section>

        <!-- ============================================
             HERO IMAGE (contained, centered)
             ============================================ -->
        <div class="container">
            <img
                src="images/Spaniels.jpg"
                alt="Spaniel dogs"
                class="hero-image"
            >
        </div>

        <!-- ============================================
             BREED STANDARD / INTRO
             ============================================ -->
        <section class="breed-standard">
            <!-- Breed standard / intro content goes here -->
        </section>

        <!-- ============================================
             MY DOGS (gallery)
             ============================================ -->
        <section class="section">
            <h2 class="page-title">My Dogs</h2>

            <div class="dog-card-container">

                <div class="dog-card">
                    <a href="028.html">
                        <img src="images/CKCS.jpg" alt="Cavalier King Charles Spaniel">
                        <h3>Cavalier</h3>
                    </a>
                </div>

                <div class="dog-card">
                    <a href="029.html">
                        <img src="images/CS.jpg" alt="Clumber Spaniel">
                        <h3>Clumber</h3>
                    </a>
                </div>

                <div class="dog-card">
                    <a href="030.html">
                        <img src="images/ECS.jpg" alt="English Cocker Spaniel">
                        <h3>Cocker</h3>
                    </a>
                </div>

                <div class="dog-card">
                    <a href="031.html">
                        <img src="images/SS.jpg" alt="English Springer Spaniel">
                        <h3>Springer</h3>
                    </a>
                </div>

                <div class="dog-card">
                    <a href="038.html">
                        <img src="images/Training.jpg" alt="Dog training session">
                        <h3>Training</h3>
                    </a>
                </div>

            </div>
        </section>
    </main>

    <!-- Autoload injects the footer partial here -->
    <div id="foot"></div>
</body>
</html>

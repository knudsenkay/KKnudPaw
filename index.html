<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Spaniel Breeds</title>

    <link rel="stylesheet" href="styles/style.css">

    <script src="styles/global.js"></script>
    <script src="styles/autoload.js"></script>
</head>

<body>

    <div id="header"></div>
    <div id="main-nav"></div>

    <section class="breed-standard">

        <img src="images/Spaniels.jpg" alt="Spaniel breeds">

        <h1>My Spaniel Breeds</h1>

        <div class="dog-card-container">

            <div class="dog-card">
                <a href="OurBreeds-Cavalier.html">
                    <img src="images/CKCS.jpg" alt="Cavalier King Charles Spaniel">
                    <h3>Cavalier</h3>
                </a>
            </div>

            <div class="dog-card">
                <a href="OurBreeds-Clumber.html">
                    <img src="images/CS.jpg" alt="Clumber Spaniel">
                    <h3>Clumber</h3>
                </a>
            </div>

            <div class="dog-card">
                <a href="OurBreeds-Cocker.html">
                    <img src="images/ECS.jpg" alt="English Cocker Spaniel">
                    <h3>Cocker</h3>
                </a>
            </div>

            <div class="dog-card">
                <a href="OurBreeds-Springer.html">
                    <img src="images/SS.jpg" alt="English Springer Spaniel">
                    <h3>Springer</h3>
                </a>
            </div>

        </div>

    </section>

    <div id="footer"></div>

    <script>
        fetch("footer.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            })
            .catch(error => console.error("Error loading footer:", error));
    </script>

</body>
</html>
